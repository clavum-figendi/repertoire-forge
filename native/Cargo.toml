[package]
name = "repertoire-forge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
shakmaty = "0.29"
pgn-reader = "0.28"

[profile.release]
strip = true
lto = "thin"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
